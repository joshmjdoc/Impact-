name: Verify IO Shortlist

on:
  pull_request:
    branches: [main]
    paths:
      - shortlist_400.csv
      - verify_io_only.py
      - .github/workflows/verify-io.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify all IO domains
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - run: >-
          python verify_io_only.py
          --input shortlist_400.csv
          --output io-verified/all.csv
          --batch-index 0
          --batch-count 1
      - uses: actions/upload-artifact@v4
        with:
          name: io-verified-all
          path: io-verified/all.csv
          if-no-files-found: error
          retention-days: 7
