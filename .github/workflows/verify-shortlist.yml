name: Verify Domain Shortlist

on:
  pull_request:
    branches: [main]
    paths:
      - shortlist_400.csv
      - verify_shortlist.py
      - .github/workflows/verify-shortlist.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify batch ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Check registry RDAP directly
        run: >-
          python verify_shortlist.py
          --input shortlist_400.csv
          --output verified/batch-${{ matrix.batch }}.csv
          --batch-index ${{ matrix.batch }}
          --batch-count 8
          --workers 1
      - uses: actions/upload-artifact@v4
        with:
          name: verified-shortlist-${{ matrix.batch }}
          path: verified/batch-${{ matrix.batch }}.csv
          if-no-files-found: error
          retention-days: 7
